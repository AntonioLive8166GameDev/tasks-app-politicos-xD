<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <title>Politics :v</title>
</head>
<body bgcolor="BLACK" style="color:WHITE">
  <br>
  <div align="center">
    <form>
      <table border=1>
        <tr>
          <td> Registro de Afiliados </td>
          <td> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; </td>
          <td>BUSCAR: <input type="search" id="busx"></td>
      
        </tr>
      </table>
    </form>
    <hr>
    <br>
    <div id="tarea-result">
      <table id="contenedor" border=1>
        
      </table>
    </div>
    <br>
    <form id="tareas-forma">
      <input type="hidden" id="tareaId">
      <table>
        <tr>
          <td>Entidad:</td>
          <td><input type="text" id="entidad" placeholder="JALISCO"></td>
        </tr>
        <tr>
          <td>Apellido paterno:</td>
          <td><input type="text" id="appat" placeholder="MENDOZA"></td>
        </tr>
        <tr>
          <td>Apellido materno:</td>
          <td><input type="text" id="apmat" placeholder="DURAN"></td>
        </tr>
        <tr>
          <td>Nombre(s):</td>
          <td><input type="text" id="nombre" placeholder="LILIANA BERENICE"></td>
        </tr>
        <tr>
          <td>Fecha de registro:</td>
          <td><input type="date" id="fregis"></td>
        </tr>
      </table>  
      <button type="submit">Guardar</button><br><br>
    </form>
    <table border=1>
      <thead>
          <tr>
            <th> ID </th> <th> Entidad </th>  <th> Apellido paterno </th> <th> Apellido materno </th> <th> Nombre(s) </th> <th> Fecha de registro </th>
          </tr>
      </thead>
      <tbody id="tareas">
      </tbody>
    </table>
  </div>
  <br>
  <script src="jquery-3.3.1.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
